<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popup_title">やさしい文章</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 data-i18n="popup_title">やさしい文章</h1>
      <div class="premium-status" id="premium-status" hidden>
        <span class="premium-badge" id="premium-badge"></span>
        <span class="premium-trial-remaining" id="premium-trial-remaining" hidden></span>
      </div>
    </header>
    <main>
      <div class="toggle-container">
        <span data-i18n="popup_toggle_label">有効にする</span>
        <label class="switch">
          <input type="checkbox" id="toggle-simplifier">
          <span class="slider round"></span>
        </label>
      </div>
      <label class="site-toggle" id="site-toggle-label">
        <input type="checkbox" id="toggle-site-disabled">
        <span data-i18n="popup_disable_on_site">このサイトでは無効にする</span>
      </label>
      <section class="readability" id="readability-section" hidden>
        <h2 data-i18n="readability_title">このページの読みやすさ</h2>
        <div class="readability-bar" aria-hidden="true">
          <div class="readability-bar-fill" id="readability-fill"></div>
        </div>
        <div class="readability-meta">
          <span class="readability-score" id="readability-score">--</span>
          <span class="readability-level" id="readability-level"></span>
        </div>
        <button
          type="button"
          class="readability-toggle"
          id="readability-details-toggle"
          aria-expanded="false"
          aria-controls="readability-details"
          hidden
          data-i18n="readability_details_open">詳細</button>
        <dl class="readability-details" id="readability-details" hidden>
          <dt data-i18n="readability_details_kanji">漢字の割合</dt>
          <dd id="readability-kanji">--</dd>
          <dt data-i18n="readability_details_avg_len">平均文長</dt>
          <dd id="readability-avg-len">--</dd>
          <dt data-i18n="readability_details_long_ratio">長文の比率</dt>
          <dd id="readability-long-ratio">--</dd>
        </dl>
        <p class="readability-premium-hint" id="readability-premium-hint" hidden
           data-i18n="readability_premium_hint">詳細はPremiumで確認できます。</p>
      </section>
    </main>
    <footer>
      <button id="open-settings" data-i18n="popup_settings">設定</button>
      <button id="upgrade-button" class="upgrade-button" hidden
              data-i18n="premium_upgrade_cta">Premiumにアップグレード</button>
    </footer>
  </div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
